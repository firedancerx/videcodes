# CI for study-crammer/: host tests (native engine + checksum tool + Kotlin data layer)
# and a real Android build (debug APK, unit tests, minified unsigned release via R8).
name: Study Crammer CI

on:
  push:
    branches: [main]
    paths: ["study-crammer/**", ".github/workflows/study-crammer-ci.yml"]
  pull_request:
    paths: ["study-crammer/**", ".github/workflows/study-crammer-ci.yml"]
  workflow_dispatch:

concurrency:
  group: study-crammer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: study-crammer

jobs:
  host-tests:
    name: Host tests (native engine, checksum tool, data layer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install zlib headers
        run: sudo apt-get update -q && sudo apt-get install -y -q zlib1g-dev
      - name: Native integrity engine + Gradle checksum tasks
        env:
          GRADLE: ${{ github.workspace }}/study-crammer/gradlew
        run: tools/host-test/run_host_tests.sh "$RUNNER_TEMP/igtest"
      - name: Kotlin data-layer unit tests (JVM)
        run: ./gradlew -p tools/host-test/jvm-harness test --console=plain

  android:
    name: Android build (debug + R8 release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null
      - name: Debug APK + unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
      - name: Release build (unsigned, R8 full mode + IG_ENFORCE)
        # No keystore in CI: this proves minify/shrink/keep rules and the enforced native build compile.
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-crammer-apks
          path: study-crammer/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: study-crammer-test-reports
          path: study-crammer/app/build/reports/
          if-no-files-found: ignore
